{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>

    <!-- CSS -->
    <link href="{% static 'css/styles.css' %}" type="text/css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">moodFlow</a>
            <a class="navbar-brand text-center mt-3" href="#">
                <img src="{% static 'img/logo-male-bez-tla.png' %}" alt="Logo" class="logo">
            </a>
            <!-- Ikony powiadomień i ustawień po prawej stronie -->
            <ul class="navbar-nav ms-auto"> <!-- "ms-auto" wyrównuje elementy do prawej -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Brak aktualnie powiadomień">
                        <i class="bi bi-bell"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-bs-toggle="tooltip" data-bs-placement="bottom" title="W budowie">
                        <i class="bi bi-gear"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Sidebar + Main Content Wrapper -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar bg-dark">
            <nav class="navbar navbar-expand-lg navbar-dark flex-column">
                <ul class="navbar-nav w-100">
                    <li class="nav-item">
                        <a class="nav-link active d-flex align-items-center">
                            <i class="bi bi-house-door me-2"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center">
                            <i class="bi bi-airplane-engines me-2"></i> Podróże
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center">
                            <i class="bi bi-umbrella me-2"></i> Outside
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center">
                            <i class="bi bi-briefcase me-2"></i> Praca
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-2"></i> Life manager
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                            <li><a class="dropdown-item" href="#">Dziennik aktywności</a></li>
                            <li><a class="dropdown-item" href="#">Finanse</a></li>
                            <li><a class="dropdown-item" href="#">Zdrowie</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="gradient-custom-2">
                <div class="container my-4">
                    <div class="d-flex justify-content-center">
                        <div class="mask-custom">
                            {% block content %}{% endblock %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- notification and settings JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
